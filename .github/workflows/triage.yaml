# This automation adds/removes the 'status: needs-triage' label to pull requests
# so that PRs needing attention are easy to find. The label is fully owned by
# this automation and reconciled on every run.
#
# The flagging rules live in ./tool/triage.mjs — see the header comment there
# for the full specification:
# https://github.com/flutter/genui/blob/main/tool/triage.mjs
#
# For the history of runs, see:
# https://github.com/flutter/genui/actions/workflows/triage.yaml


name: Flag/Unflag pull requests

on:
  # Periodic reconciliation. The flagging rule is time-based (no maintainer
  # response for more than a day), so the cron is what flags PRs; it also
  # removes the label once a PR no longer matches.
  schedule:
    - cron: "0 * * * *" # hourly
  # A maintainer comment can unflag a PR right away. `issue_comment` runs on the
  # default branch with a write token, including for comments on fork PRs.
  issue_comment:
    types: [created]
  # PR lifecycle events (opened, edited, synchronize, ...) are deliberately
  # absent: they never change whether a PR matches the rule, so the hourly cron
  # covers them. A plain `pull_request` trigger gets a read-only token on PRs
  # from forks and cannot label them, and `pull_request_target` is blocked by
  # policy in public repositories. Review events are absent for the same
  # read-only-token reason; maintainer reviews are picked up by the next cron.
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Every run reconciles all open PRs, so runs are interchangeable. Queue them
# instead of running in parallel so overlapping runs do not race on labels.
concurrency:
  group: triage
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      # Always run the rules from main, never from a PR's copy of the script.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile triage flag labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');

            const filePath = path.resolve('./tool/triage.mjs');
            const fileUrl = pathToFileURL(filePath).href;

            const importedModule = await import(fileUrl);
            await importedModule.default({ github, context });
