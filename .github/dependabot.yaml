version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "autosubmit"
  - package-ecosystem: "pub"
    # genui is deprecated in favor of the a2ui packages, so genui and the
    # packages that depend on it are left out of this list.
    directories:
      - "/packages/genai_primitives"
      - "/packages/json_schema_builder"
      - "/tool/fix_copyright"
      - "/tool/test_and_fix"
    schedule:
      interval: "daily"
    labels:
      - "autosubmit"
